name: Release

on:
  push:
    branches: [develop, release]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read version from project file
        id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/FlanderDev.RouteGen.Abstractions/FlanderDev.RouteGen.Abstractions.csproj)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not find <Version> in src/FlanderDev.RouteGen.Abstractions/FlanderDev.RouteGen.Abstractions.csproj"
            exit 1
          fi
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore FlanderDev.RouteGen.sln

      - name: Build
        run: dotnet build FlanderDev.RouteGen.sln --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/FlanderDev.RouteGen.Abstractions/FlanderDev.RouteGen.Abstractions.csproj \
            --configuration Release --no-build --output ./artifacts -p:Version=${{ steps.version.outputs.version }}
          dotnet pack src/FlanderDev.RouteGen.Generators/FlanderDev.RouteGen.Generators.csproj \
            --configuration Release --output ./artifacts -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: ls -l ./artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  release:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag is derived from the version read out of the project file in the build job above,
          # not hand-pushed -- softprops/action-gh-release creates it if it doesn't exist yet.
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          files: ./artifacts/*.nupkg
          generate_release_notes: true

  publish:
    needs: [build, release] # if release fails for some reason, then something is very wrong.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
        contents: read
        id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: FlanderDev

      - name: Publish packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in ./artifacts/*.nupkg; do
            echo "Publishing $package"
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json
          done
