name: Release

# Builds the abstractions + generator packages and publishes a GitHub Release with the ready-to-use
# .nupkg files attached, on every push of a tag matching v*.*.* (e.g. v0.1.0). Also runs a
# build-only check on every push/PR to main so breakage is caught before a tag is ever cut.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore RouteGen.sln

      - name: Build
        run: dotnet build RouteGen.sln --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/RouteGen.Abstractions/RouteGen.Abstractions.csproj \
            --configuration Release --no-build --output ./artifacts
          dotnet pack src/RouteGen.Generators/RouteGen.Generators.csproj \
            --configuration Release --output ./artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          generate_release_notes: true

      # Uncomment to also publish to nuget.org once NUGET_API_KEY is set as a repo secret:
      # - name: Push to NuGet.org
      #   run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
